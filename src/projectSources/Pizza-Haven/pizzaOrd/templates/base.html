<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pizza Haven{% endblock %}</title>
  <style>
    /* Full height flex layout for sticky footer */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7f8;
    }
    /* Header */
    header {
      background: #5fcf80;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      margin: 0 10px;
    }
    /* Main content area */
    .container {
      flex: 1;
      max-width: 1200px;
      margin: 20px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    /* Footer */
    footer {
      padding: 20px;
      background: #eee;
      text-align: center;
      font-size: 0.9em;
      border-top: 1px solid #ccc;
    }
    footer a {
      color: #333;
      text-decoration: none;
      margin: 0 5px;
    }
    footer p {
      margin: 5px 0;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-left">
        {% if user.is_authenticated %}
            <a href="{% url 'home' %}">Home</a>
        {% else %}
            <a href="{% url 'index' %}">Home</a>
        {% endif %}
    </div>
    <div class="header-right">
      <a href="{% url 'register' %}">Register</a>
      <a href="{% url 'custom_login' %}">Log In</a>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container">
    {% block content %}
    <!-- Page-specific content goes here -->
    {% endblock %}
  </div>

  <!-- Footer -->
  <footer>
    <p>
      <a href="https://www.linkedin.com" target="_blank">LinkedIn</a> |
      <a href="https://www.github.com" target="_blank">GitHub</a>
    </p>
    <p>&copy; 2025 Bailey Scanlan. All rights reserved.</p>
  </footer>
</body>
</html>
