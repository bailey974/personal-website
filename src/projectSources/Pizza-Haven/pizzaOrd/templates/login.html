{% extends "base.html" %}

{% block title %}Log In - Pizza Haven{% endblock %}

{% block content %}
  <style>
    .login-container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .login-container form input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .login-container form button {
      width: 100%;
      padding: 12px;
      background: #ff4500;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .login-container form button:hover {
      background: #e03e00;
    }
    .login-container p {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9em;
    }
    .login-container p a {
      color: #ff4500;
      text-decoration: none;
    }
  </style>

  <div class="login-container">
    <h2>Log In to Pizza Haven</h2>
    {% if messages %}
      {% for message in messages %}
        <p style="color: red;">{{ message }}</p>
      {% endfor %}
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Sign Up Here</a></p>
  </div>
{% endblock %}
